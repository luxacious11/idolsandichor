<form id="form-approve" data-type="grid">
    <label>
        <b>Character</b>
        <span><select id="id" class="clip-pending" required></select></span>
    </label>
    <label>
        <b>About</b>
        <span><textarea id="about" placeholder="Short, sweet, and to-the-point" required></textarea></span>
    </label>
    <button type="submit" id="submit">Submit</button>
</form>
